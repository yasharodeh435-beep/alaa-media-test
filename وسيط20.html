<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;font-size:18px;line-height:1.75}

.opts{display:grid;gap:10px;margin:12px 0}

.opt.good{border-color:var(--ok);background:var(--okbg)}

.qtag{display:inline-block;font-size:14px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 10px}

.gi{min-height:52px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;text-align:center;line-height:1.5}
.gi.sel{border-color:var(--main);background:var(--sel)}
.gi.done{border-color:var(--ok);background:var(--okbg);cursor:default}
.gmsg{min-height:28px;color:var(--mute);font-size:16px}
.by{background:linear-gradient(135deg,#1f6f5c,#2a7f8e);color:#fff;font-size:30px;font-weight:800;text-align:center;padding:16px 12px;border-radius:16px;margin:0 0 14px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.18)}

.dgs{display:flex;flex-direction:column;gap:2px}.dgi{background:var(--card);border:2px solid var(--main);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px}

details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:12px 0}
summary{cursor:pointer;font-weight:700;min-height:36px}

body{background:radial-gradient(circle at 12% 8%,rgba(255,200,60,.20),transparent 38%),radial-gradient(circle at 92% 28%,rgba(60,170,200,.16),transparent 36%),var(--bg)}

#app{padding-bottom:84px}
.snd{position:fixed;bottom:14px;left:14px;width:46px;height:46px;border-radius:50%;border:2px solid var(--main);background:var(--card);font-size:21px;opacity:.92;cursor:pointer;z-index:60;box-shadow:0 3px 8px rgba(0,0,0,.2)}

.dst{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.dsp{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;position:relative}.dsp .pic{font-size:46px;line-height:1.2}.dsp .pn{position:absolute;inset-inline-start:6px;top:6px;background:var(--main);color:var(--main-ink);border-radius:50%;width:24px;height:24px;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700}.dsp .cap{font-size:16px;line-height:1.5}

  var h='<div class="by">تم إعداد هذا الوكيل: الأستاذ علاء عودة</div>'+owl('مرحبًا! أنا بومة العلم 🦉 سأرافقك في رحلة التعلم. اختر حصتك وابدأ.')+'<h1>'+esc(meta.title||'وسيط تعليمي')+'</h1>'+(meta.subject?'<p class="sub">'+esc(meta.subject)+'</p>':'')
   +'<div class="note">'+esc(meta.status||'نموذج أولي يحتاج مراجعة المعلم')+': لا يُستخدم مع الطلبة قبل أن يراجعه المعلم.</div>'
   +(meta.sessions&&meta.sessions>SES.length?'<div class="note">طلب المعلم '+meta.sessions+' حصص، لكن المحتوى المتوفر ('+list.length+' أهداف) يكفي لـ '+SES.length+' فقط. راجع تقرير المراجعة.</div>':'')
   +'<h2>ماذا سأتعلم؟</h2><p class="sub">'+(SES.length>1?'مقسّم إلى '+SES.length+' حصص. ابدأ بالحصة التي يحددها معلمك.':'حصة واحدة.')+'</p>';
  SES.forEach(function(s,k){
    var items=s.idx.map(function(i){return '<li>'+esc(list[i].text)+chipFor(list[i])+'</li>';}).join('');
    var fo=firstOpen(k),started=s.idx.some(function(i){return P.status[list[i].id];});
    var lab=fo<0?'راجع الحصة':(started?'تابع الحصة':'ابدأ الحصة');
    h+='<div class="card scard"><div class="sn" aria-hidden="true">'+s.n+'</div><h2>الحصة '+s.n+(s.est?' <span class="sub">(نحو '+s.est+' دقائق من العمل على الجهاز)</span>':'')+'</h2><ul>'+items+'</ul><button class="btn" data-s="'+k+'">'+lab+' '+s.n+'</button></div>';
  });
  h+='<h2>ماذا أحتاج؟</h2><p>هاتفك أو حاسوبك، ودفترًا وقلمًا إن أردت. لن نطلب اسمك ولا أي معلومة عنك.</p>'+(SND?'<p class="sub">🔊 يحتوي الوسيط على أصوات؛ إن أردت الهدوء فاضغط زر الصوت في الزاوية.</p>':'')
   +'<p class="sub">'+(SAVE?'يُحفظ تقدمك في هذا المتصفح فقط ولا يُرسل إلى أي جهة، ويمكنك مسحه في أي وقت من آخر صفحة.':'لا يحفظ هذا الملف تقدمك: إذا أغلقت الصفحة تبدأ من جديد، ولا يُرسل أي شيء إلى أي جهة.')+'</p>'
   +'<button class="btn alt" id="dg">اختبار قصير قبل البدء (اختياري)</button><p class="sub">سؤال واحد لكل هدف ليعرف الوسيط من أين تبدأ. لا يحسب عليك.</p>'
   +(anyDone?'<button class="btn alt" id="again">ابدأ من جديد</button>':'');
  show(h,-1);
  app.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){runSession(+b.getAttribute('data-s'));};});
  on('again',function(){clearAll();start();});
  on('dg',function(){clearAll();diag();});
}
function runSession(k){CS=k;var i=firstOpen(k);if(i<0)i=SES[k].idx[0];begin(i);}
function sessionEnd(){
  var nk=CS+1<SES.length?CS+1:-1;
  sfx('win');confetti();show(owl('انتهت حصتك بنجاح! أنا فخورة بك.')+'<h2>انتهت الحصة '+SES[CS].n+' 🎉</h2><p>أحسنت. يمكنك مراجعة ملخصك'+(nk>=0?' أو الانتقال إلى الحصة التالية':'')+'.</p>'
   +(nk>=0?'<button class="btn" id="ns">ابدأ الحصة '+SES[nk].n+'</button>':'')+'<button class="btn alt" id="sm">عرض ملخص رحلتي</button><button class="btn alt" id="hm">العودة إلى الحصص</button>',list.length);
  on('ns',function(){runSession(nk);});on('sm',summary);on('hm',start);
}
function begin(i){
  var o=list[i];
  var dep=(o.depends_on||[]).filter(function(id){return P.status[id]==='teacher'||P.status[id]==='blocked';});
  if(dep.length){P.status[o.id]='blocked';save();show('<h2>سنؤجل هذا الهدف</h2><p>هذا الهدف يعتمد على هدف احتجت فيه إلى مساعدة معلمك. سنتركه الآن، وتعود إليه بعد أن يساعدك معلمك.</p><button class="btn" id="nx">متابعة</button>',i);on('nx',function(){nextOrEnd(i);});return;}
  C={i:i,o:o,u:units[o.id],used:{},c:0,w:0,last:'start',k:0};
  var dg=P.diag[o.id];if(dg&&C.u[dg.n]){C.used[dg.n]=1;C.c=dg.ok?1:0;}
  var u=C.u;
  var ex=(u.explain||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('');
  show(owl('اقرأ الشرح والرسوم، ثم انتقل إلى الأسئلة.')+'<h2>'+esc(u.title||o.text)+'</h2><div class="card">'+vis(u)+'<ul>'+ex+'</ul>'+dgm(u,'main')+(u.example?'<div class="example"><b>مثال:</b> '+esc(u.example)+'</div>':'')+'</div>'+altBox(u,false)+ttsBtn('say')
   +'<button class="btn" id="q">أنا جاهز للأسئلة</button>',i);
  on('q',nextQ);ttsInit('say',(u.explain||[]).join('. ')+'. '+(u.example||''));
}
var C=null;

/* ---------- الأسئلة (منطق التكيف) ---------- */
function need(){var v=0;QN.forEach(function(n){if(validQ(C.u[n]))v++;});return Math.max(1,Math.min(3,v));}
function pick(){
  var order=C.last==='wrong'?['alt_q','extra_q1','verify_q','extra_q2','apply_q','understand_q']:C.last==='start'?['understand_q','apply_q','alt_q','verify_q','extra_q1','extra_q2']:['apply_q','verify_q','extra_q1','extra_q2','alt_q','understand_q'];
  for(var k=0;k<order.length;k++){var n=order[k],q=C.u[n];if(!C.used[n]&&q&&q.options&&q.options.length>1)return n;}
  return null;
}
function nextQ(){
  var n=pick();
  if(!n){finishObjective(C.c>=need()?'mastered':'review');return;}
  C.used[n]=1;C.cur=n;
  var q=C.u[n],opts=q.options.map(function(t,i){return '<button class="opt" data-i="'+i+'">'+esc(t)+'</button>';}).join('');
  show('<span class="qtag">سؤال '+(C.k=(C.k||0)+1)+'</span><h2>'+esc(q.stem)+'</h2><div class="opts" role="group" aria-label="الخيارات">'+opts+'</div><div id="fb" aria-live="polite"></div>',C.i);
  var bs=app.querySelectorAll('.opt');
  for(var i=0;i<bs.length;i++){bs[i].onclick=answer;}
}
function answer(ev){
  var b=ev.currentTarget,idx=+b.getAttribute('data-i'),q=C.u[C.cur],bs=app.querySelectorAll('.opt'),fb=document.getElementById('fb');
  for(var i=0;i<bs.length;i++){bs[i].disabled=true;}
  if(idx===q.answer_index){
    C.c++;C.last='right';b.className='opt good';b.innerHTML='✔ '+b.innerHTML;
    var done=C.c>=need();
    sfx('ok');fb.innerHTML='<div class="fb good"><b>🦉 '+cheer()+'</b>'+esc(q.why||'')+'</div><button class="btn" id="nx">'+(done?'أتقنت هذا الهدف، تابع':'التالي')+'</button>';
    on('nx',function(){done?finishObjective('mastered'):nextQ();});
  }else{
    C.w++;C.last='wrong';b.className='opt no';b.innerHTML='✖ '+b.innerHTML;sfx('no');
    if(C.w>=3){
      fb.innerHTML='<div class="fb help"><b>لا بأس، لنأخذ استراحة من هذا الجزء.</b>تعثّرك هنا لا يعني شيئًا سيئًا، فهو يخبرنا أن هذا الهدف يحتاج شرحًا معك.</div><button class="btn" id="nx">متابعة</button>';
      on('nx',function(){finishObjective(C.o.type==='gate'?'teacher':C.o.type==='enrichment'?'skipped':'review');});
      return;
    }
    var u=C.u,h='';
    if(C.w===1){h='<b>لا بأس، فكّر معنا من جديد.</b>'+esc(u.hint1||'')+'<div style="margin-top:8px">'+vis(u)+dgm(u,'alt')+(u.example?'<div class="example"><b>مثال:</b> '+esc(u.example)+'</div>':'')+'</div>';}
    else{var s=u.support2||{};h='<b>لنعد خطوة إلى الخلف.</b>'+esc(s.review||'')+dgm(u,'rev')+(s.worked_example?'<div class="example"><b>مثال محلول جزئيًا:</b> '+esc(s.worked_example)+'</div>':'');}
    fb.innerHTML='<div class="fb help">'+h+'</div><button class="btn" id="nx">جرّب سؤالًا آخر</button>';
    on('nx',nextQ);
  }
}

/* ---------- نهاية الهدف ---------- */
function finishObjective(st){
  P.status[C.o.id]=st;P.seen[C.o.id]=Object.keys(C.used);save();
  if(st==='mastered'){sfx('win');confetti();}else if(st==='review'){sfx('star');}
  if(st==='teacher'){referral();return;}
  if(st==='mastered'&&C.u.game&&C.u.game.pairs&&C.u.game.pairs.length>=2){game();return;}
  after(st);
}
function after(st){
  var last=nextIdx(C.i)<0;
  var msg=st==='mastered'?'<h2>أتقنت هذا الهدف ✔</h2><p>عمل جميل. انتقل إلى الهدف التالي.</p>':st==='review'?'<h2>أنهينا هذا الهدف</h2><p>يُفضّل أن تراجعه مرة أخرى لاحقًا أو تسأل معلمك عنه، ثم تابع.</p>':'<h2>تجاوزنا هذا الجزء الإثرائي</h2><p>هو اختياري ولا يمنع المتابعة.</p>';
  show((st==='mastered'?owl('أحسنت! أضفت نجمة جديدة ⭐'):'')+msg+'<button class="btn" id="nx">'+(last?'إنهاء الحصة':'الهدف التالي')+'</button>',C.i);
  on('nx',function(){nextOrEnd(C.i);});
}
function referral(){
  show('<h2>هذا الجزء يحتاج معلمك 💙</h2><p>وصلنا إلى هدف «'+esc(C.o.text)+'» وتحتاج هنا إلى شرح مباشر. قل لمعلمك: «أحتاج مساعدة في هذا الهدف». لا تقلق، فهذا لا يؤثر على تقويمك.</p>'+altBox(C.u,true)
   +'<p>سنكمل بقية الأهداف المستقلة عنه.</p><button class="btn" id="nx">متابعة</button>',C.i);
  on('nx',function(){nextOrEnd(C.i);});
}

/* ---------- اللعبة (مطابقة) ---------- */
function game(){
  var g=C.u.game,pairs=g.pairs.filter(function(p){return p&&p.length===2;}),n=pairs.length,order=[];
  for(var k=0;k<n;k++)order.push((k+C.i+1)%n);
  var L=pairs.map(function(p,i){return '<button class="gi" data-l="'+i+'">'+esc(p[0])+'</button>';}).join('');
  var R=order.map(function(j){return '<button class="gi" data-r="'+j+'">'+esc(pairs[j][1])+'</button>';}).join('');
  show('<h2>لعبة صغيرة 🎯</h2><p>'+esc(g.instruction||'طابق كل عنصر بما يناسبه.')+' اضغط عنصرًا من اليمين ثم ما يناسبه من اليسار. لا وقت محدد.</p><div class="gcols"><div class="gc">'+L+'</div><div class="gc">'+R+'</div></div><div class="gmsg" id="gm" aria-live="polite"></div>'+altBox(C.u,false)
   +'<button class="btn alt" id="skip">تخطَّ اللعبة</button>',C.i);
  var sel=null,matched=0,gm=document.getElementById('gm');
  function clear(){var s=app.querySelectorAll('.gi.sel');for(var i=0;i<s.length;i++)s[i].classList.remove('sel');}
  app.querySelectorAll('.gi').forEach(function(el){
    el.onclick=function(){
      if(el.classList.contains('done'))return;
      if(el.hasAttribute('data-l')){clear();sel=el;el.classList.add('sel');gm.textContent='';return;}
      if(!sel){gm.textContent='اختر عنصرًا من العمود الأول أولًا.';return;}
      var li=+sel.getAttribute('data-l'),rj=+el.getAttribute('data-r');
      if(li===rj||pairs[li][1]===pairs[rj][1]){
        sel.classList.remove('sel');sel.classList.add('done');el.classList.add('done');sel.innerHTML='✔ '+sel.innerHTML;el.innerHTML='✔ '+el.innerHTML;sel=null;matched++;sfx('match');gm.textContent='مطابقة صحيحة!';
        if(matched===n){gm.textContent='أحسنت! أكملت اللعبة.';sfx('win');confetti();show2();}
      }else{sfx('no');el.classList.add('shake');setTimeout(function(){el.classList.remove('shake');},350);gm.textContent='ليست هذه المطابقة، جرّب مرة أخرى.';}
    };
  });
  function show2(){var b=document.getElementById('skip');b.textContent='متابعة';b.className='btn';}
  on('skip',function(){after('mastered');});
}

/* ---------- اختبار قصير + تقويم ختامي ---------- */
function validQ(q){return q&&q.options&&q.options.length>1&&typeof q.answer_index==='number';}
function quiz(items,mode,onDone){
  var k=0,res=[];
  function ask(){
    if(k>=items.length){onDone(res);return;}
    var it=items[k],q=it.q;
    var opts=q.options.map(function(t,i){return '<button class="opt" data-i="'+i+'">'+esc(t)+'</button>';}).join('');
    show('<span class="qtag">'+(mode==='final'?'التقويم الختامي':'الاختبار القصير')+' · '+(k+1)+' من '+items.length+'</span><h2>'+esc(q.stem)+'</h2><div class="opts" role="group" aria-label="الخيارات">'+opts+'</div><div id="fb" aria-live="polite"></div>',-2);
    var bs=app.querySelectorAll('.opt');
    for(var i=0;i<bs.length;i++){bs[i].onclick=function(ev){
      var b=ev.currentTarget,idx=+b.getAttribute('data-i'),ok=idx===q.answer_index,fb=document.getElementById('fb');
      for(var j=0;j<bs.length;j++){bs[j].disabled=true;}
      res.push({o:it.o,n:it.n,ok:ok});
      var last=k>=items.length-1,btn='<button class="btn" id="nx">'+(last?'عرض النتيجة':'التالي')+'</button>';
      if(mode==='final'){
        b.className='opt '+(ok?'good':'no');b.innerHTML=(ok?'✔ ':'✖ ')+b.innerHTML;
        if(!ok){bs[q.answer_index].className='opt good';}
        fb.innerHTML='<div class="fb '+(ok?'good':'help')+'"><b>'+(ok?'أحسنت!':'ليست هذه الإجابة.')+'</b>'+(ok?'':'الإجابة الصحيحة: '+esc(q.options[q.answer_index])+'. ')+esc(q.why||'')+'</div>'+btn;
      }else{
        b.className='opt sel';
        fb.innerHTML='<div class="fb good"><b>تم تسجيل إجابتك.</b></div>'+btn;
      }
      on('nx',function(){k++;ask();});
    };}
  }
  ask();
}
function diag(){
  var items=[];
  list.forEach(function(o){var q=units[o.id].understand_q;if(validQ(q))items.push({o:o,n:'understand_q',q:q});});
  if(!items.length){begin(0);return;}
  quiz(items,'diag',function(res){
    res.forEach(function(r){P.diag[r.o.id]={n:r.n,ok:r.ok};});save();
    var rows=res.map(function(r){return '<div class="card"><div class="row"><b>'+esc(r.o.text)+'</b><span class="chip '+(r.ok?'m':'r')+'">'+(r.ok?'تبدو متمكنًا':'سنشرحه معًا')+'</span></div></div>';}).join('');
    show('<h2>نتيجة الاختبار القصير</h2><p>هذه صورة أولية فقط، وليست علامة. سنمر على كل الأهداف، وستكون الأسئلة أسهل في الأهداف التي أجبت عنها صحيحًا.</p>'+rows+'<button class="btn" id="go2">ابدأ التعلم</button>',-2);
    on('go2',function(){runSession(0);});
  });
}
function finalQ(){
  var items=[],order=['verify_q','apply_q','alt_q','understand_q'];
  list.forEach(function(o){
    var u=units[o.id],seen=P.seen[o.id]||[],pk=null,k;
    for(k=0;k<order.length;k++){if(seen.indexOf(order[k])<0&&validQ(u[order[k]])){pk=order[k];break;}}
    if(!pk){for(k=0;k<order.length;k++){if(validQ(u[order[k]])){pk=order[k];break;}}}
    if(pk)items.push({o:o,n:pk,q:u[pk]});
  });
  if(!items.length){summary();return;}
  quiz(items,'final',function(res){
    var good=res.filter(function(r){return r.ok;}).length;
    var rows=res.map(function(r){return '<div class="card"><div class="row"><b>'+esc(r.o.text)+'</b><span class="chip '+(r.ok?'m':'r')+'">'+(r.ok?'أجبت صحيحًا':'يحتاج مراجعة')+'</span></div></div>';}).join('');
    show('<h2>نتيجة التقويم الختامي</h2><p>أجبت صحيحًا عن '+good+' من '+res.length+'. هذا تقويم ذاتي يساعدك على معرفة ما تراجعه، ولا يُرسل إلى أي جهة.</p>'+rows+(good<res.length?'<p>راجع الأهداف التي عليها «يحتاج مراجعة» أو اسأل معلمك عنها.</p>':'<p>عمل رائع! أنت مستعد للانتقال إلى ما بعد هذا الدرس.</p>')+'<button class="btn" id="sm">العودة إلى ملخص رحلتي</button>',-2);
    on('sm',summary);
  });
}

/* ---------- الملخص ---------- */
var CH={mastered:['أتقنت','m'],review:['أحتاج مراجعة','r'],teacher:['اطلب مساعدة المعلم','t'],skipped:['تخطيت','r'],blocked:['ينتظر مساعدة المعلم','t']};
function summary(){
  var rows=list.map(function(o){
    var st=P.status[o.id],c=CH[st],sv=P.self[o.id];
    var b=['😟','😐','😊'].map(function(e,k){return '<button data-o="'+esc(o.id)+'" data-v="'+(k+1)+'" aria-pressed="'+(sv===k+1)+'" aria-label="تقديري لنفسي '+(k+1)+' من 3">'+e+'</button>';}).join('');
    return '<div class="card"><div class="row"><b>'+esc(o.text)+'</b>'+(c?'<span class="chip '+c[1]+'">'+c[0]+'</span>':'<span class="chip r">لم أبدأ بعد</span>')+'</div><div class="self" role="group" aria-label="كيف أرى نفسي في هذا الهدف؟">'+b+'</div></div>';
  }).join('');
  var miss=objs.filter(function(o){return !units[o.id];});
  var mh=miss.length?'<div class="note">لم تتوفر وحدة تعلم للأهداف: '+miss.map(function(o){return esc(o.text);}).join('، ')+'. اسأل معلمك عنها.</div>':'';
  show('<h2>ملخص رحلتي</h2><p>اضغط الوجه الذي يعبّر عن شعورك تجاه كل هدف: 😟 ما زلت أحتاج مساعدة، 😐 أفهمه قليلًا، 😊 أفهمه جيدًا.</p>'+rows+mh
   +'<details><summary>متى أطلب مساعدة معلمي؟</summary><ul><li>إذا أخطأت في سؤال بعد التلميح والمثال.</li><li>إذا لم أفهم الشرح بعد قراءته مرتين.</li><li>إذا شعرت أن الجهاز لا يعمل أو لا أستطيع إكمال النشاط.</li></ul></details>'
   +(FINALON?'<button class="btn" id="fin">التقويم الختامي (اختياري)</button>':'')+'<button class="btn alt" id="hm">العودة إلى الحصص</button><button class="btn alt" id="redo">ابدأ من جديد</button>'+(SAVE?'<button class="btn alt" id="wipe">امسح تقدمي من هذا الجهاز</button>':''),list.length);
  app.querySelectorAll('.self button').forEach(function(b){b.onclick=function(){P.self[b.getAttribute('data-o')]=+b.getAttribute('data-v');save();summary();};});
  on('fin',finalQ);
  on('hm',start);
  on('redo',function(){clearAll();start();});
  on('wipe',function(){clearAll();start();});
}

document.getElementById('foot').innerHTML='<p>أُنتج هذا المورد باستخدام برومبت مساعد المعلم ومصمم الموارد التعليمية المفتوحة، من إعداد الأستاذ علاء عودة.</p><p>هذا المورد نموذج أولي أُنتج بمساعدة الذكاء الاصطناعي. لا يُستخدم مع الطلبة ولا يُنشر قبل مراجعة المعلم لصحة المحتوى، وتطابقه مع المنهاج، وملاءمته للسياق المحلي، وسلامة الأنشطة، وحقوق استخدام عناصره. يبقى قرار الاعتماد والتعديل والنشر مسؤولية المعلم والمؤسسة التعليمية.</p>';
(function(){

  function li(a){return a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');}
  var h='<details id="tn"><summary>ملاحظات للمعلم (للمراجعة قبل مشاركة الوسيط مع الطلبة)</summary>'
   +'<p>هذا القسم موجّه للمعلم وحده. احذفه أو لا تشارك الملف مع الطلبة قبل مراجعته.</p>';
  h+=(w.length?'<p><b>ملاحظات تحتاج مراجعتك ('+w.length+'):</b></p><ul>'+li(w)+'</ul>':'<p>لم تُرصد ملاحظات تحتاج مراجعة خاصة، لكن المراجعة العامة تبقى لازمة.</p>');
  if(f.length){h+='<p><b>تصحيحات تمت تلقائيًا ('+f.length+'):</b></p><ul>'+li(f)+'</ul>';}
  var ses=(D.sessions||[]).map(function(s){return 'الحصة '+s.n+': '+(s.ids||[]).join('، ')+' (نحو '+s.est_min+' دقائق من العمل الرقمي)';});
  if(ses.length){h+='<p><b>توزيع الأهداف على الحصص</b> (زمن الحصة المحدد '+esc(meta.session_minutes||'')+' دقيقة؛ التقدير حسابي ولم يُجرَّب مع طلبة):</p><ul>'+li(ses)+'</ul>';}
  var rf=(D.objectives||[]).map(function(o){return o.id+': '+(o.guide_ref?('دليل المعلم: «'+o.guide_ref+'»'):'لا ربط بدليل المعلم')+(o.competency?(' | الكفاية: '+o.competency):'')+(o.depends_on&&o.depends_on.length?(' | يعتمد على: '+o.depends_on.join('، ')):'');});
  h+='<p><b>ربط الأهداف بالمصادر:</b></p><ul>'+li(rf)+'</ul>';
  if(meta.final_marks){h+='<p><b>علامة التقويم الختامي المعتمدة:</b> '+esc(meta.final_marks)+'. التقويم الرقمي ذاتي ولا يُحسب عليها؛ لتحويل نتيجته: العلامة = (عدد الصحيح ÷ عدد البنود) × '+esc(meta.final_marks)+'.</p>';}
  h+='<p><b>إعدادات هذا الملف:</b> حفظ التقدم محليًا: '+(SAVE?'مفعّل':'مغلق')+'، التقويم الرقمي: '+(FINALON?'مفعّل':'مغلق')+'.</p>';
  h+='<p><b>قائمة مراجعة سريعة:</b></p><ul><li>هل المعلومات صحيحة وموافقة لدرسك؟</li><li>هل الأسئلة واضحة وإجاباتها الصحيحة صحيحة فعلًا؟</li><li>هل لعبة المطابقة والنشاط البديل مناسبان لطلبتك؟</li><li>هل ما ورد في الأمثلة مناسب للسياق المحلي؟</li><li>هل المخططات التوضيحية صحيحة وعباراتها العربية واضحة؟</li></ul></details>';
  document.getElementById('foot').insertAdjacentHTML('afterbegin',h);
})();
start();
})();
</script>
